<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bell Tower - Chinese Buddhist Monastery Hall Guide</title>
  <meta name="description" content="In Chinese Buddhist monasteries, the Bell Tower is conventionally placed on the east side of the Hall of Heavenly Kings, forming the “Bell and Drum Towers” with the Drum Tower on the west. It is an iconic side hall in temple regulations. It is usually a two-story traditional timber pavilion, with double eaves, flying corners, blue-gray bricks and tiles, a stable base, and upper windows opening around a suspended bell." />
  <link rel="canonical" href="../halls/zhonglou.html" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body class="detailBody">
  <header class="detailTopbar">
    <a class="back" href="../index.html">Back to Guide Map of Han Buddhism Temple</a>
    <span id="pageTitle">Bell Tower</span>
  </header>
  <main class="detailPage">
    <section class="imageCard imageCount1">
      <div class="soundImageWrap">
        <img class="hallPhoto" src="../images/zhonglou.png" alt="Bell Tower image 1" />
        <span class="soundHotspot" role="button" tabindex="0" data-sound="../music/zhongsheng_2.9s.mp3" data-x="50" data-y="48" data-w="9" data-h="16" style="position:absolute;z-index:2;display:block;box-sizing:border-box;left:0;top:0;width:1px;height:1px;transform:translate(-50%,-50%);margin:0;padding:0;border:0;background:transparent;cursor:pointer;" aria-label="Play Bell Tower sound"></span>
      </div>
    </section>
    <article class="articleCard">
      <p class="eyebrow">Temple Hall</p>
      <div id="markdownContent" class="markdownBody" aria-live="polite">
        <h1>Bell Tower</h1>
        <p class="summary">Loading Markdown content...</p>
      </div>
      <a class="mdLink" href="../content/zhonglou.md">View Markdown source</a>
    </article>
  </main>
  <script>
    function updateSoundHotspots() {
      document.querySelectorAll('.soundHotspot').forEach((button) => {
        const wrap = button.closest('.soundImageWrap');
        const image = wrap ? wrap.querySelector('.hallPhoto') : null;
        if (!wrap || !image || !image.complete || !image.naturalWidth) return;

        const width = image.clientWidth;
        const height = image.clientHeight;
        button.style.left = (width * Number(button.dataset.x) / 100) + 'px';
        button.style.top = (height * Number(button.dataset.y) / 100) + 'px';
        button.style.width = (width * Number(button.dataset.w) / 100) + 'px';
        button.style.height = (height * Number(button.dataset.h) / 100) + 'px';
      });
    }

    document.querySelectorAll('[data-sound]').forEach((button) => {
      async function playSound() {
        const audio = new Audio(button.dataset.sound);
        audio.currentTime = 0;
        try {
          await audio.play();
        } catch (error) {
          console.warn('Audio playback was blocked by the browser or the file is unavailable.', error);
        }
      }

      button.addEventListener('click', playSound);
      button.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          playSound();
        }
      });
    });
    window.addEventListener('load', updateSoundHotspots);
    window.addEventListener('resize', updateSoundHotspots);
    updateSoundHotspots();
  </script>

  <script>
    const markdownPath = '../content/zhonglou.md';
    const contentEl = document.querySelector('#markdownContent');
    const pageTitleEl = document.querySelector('#pageTitle');
    let lastMarkdown = '';

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function inlineMarkdown(value) {
      return escapeHtml(value)
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>');
    }

    function renderMarkdown(markdown) {
      const lines = markdown.replace(/\r\n?/g, '\n').split('\n');
      let html = '';
      let paragraph = [];
      let listItems = [];

      function flushParagraph() {
        if (!paragraph.length) return;
        html += '<p>' + paragraph.map((line) => '<span class="mdLine">' + inlineMarkdown(line) + '</span>').join('') + '</p>';
        paragraph = [];
      }

      function flushList() {
        if (!listItems.length) return;
        html += '<ol>' + listItems.map((item) => '<li>' + inlineMarkdown(item) + '</li>').join('') + '</ol>';
        listItems = [];
      }

      for (const rawLine of lines) {
        const line = rawLine.trim();

        if (!line) {
          flushParagraph();
          flushList();
          continue;
        }

        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        if (heading) {
          flushParagraph();
          flushList();
          const level = heading[1].length;
          html += '<h' + level + '>' + inlineMarkdown(heading[2]) + '</h' + level + '>';
          continue;
        }

        const orderedItem = line.match(/^\d+[.)]\s+(.+)$/);
        if (orderedItem) {
          flushParagraph();
          listItems.push(orderedItem[1]);
          continue;
        }

        flushList();
        paragraph.push(line);
      }

      flushParagraph();
      flushList();
      return html;
    }

    function getFirstHeading(markdown) {
      const match = markdown.match(/^#\s+(.+)$/m);
      return match ? match[1].trim() : 'Bell Tower';
    }

    async function loadMarkdown() {
      try {
        const response = await fetch(markdownPath + '?t=' + Date.now(), { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const markdown = await response.text();
        if (markdown === lastMarkdown) return;
        lastMarkdown = markdown;
        const title = getFirstHeading(markdown);

        contentEl.innerHTML = renderMarkdown(markdown);
        pageTitleEl.textContent = title;
        document.title = title + ' - Chinese Buddhist Monastery Hall Guide';
      } catch (error) {
        contentEl.innerHTML = '<h1>Bell Tower</h1><p class="summary">Markdown content failed to load. Please open this page through the local server, for example http://localhost:3000/en/halls/zhonglou.html.</p>';
        console.error('Failed to load Markdown:', error);
      }
    }

    loadMarkdown();
    setInterval(loadMarkdown, 2000);
  </script>
</body>
</html>
